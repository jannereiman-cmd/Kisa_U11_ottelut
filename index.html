<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KISA U11 Syksy 2026 - Peliohjelma</title>
<style>
  :root {
    --blue: #1e5fbf;
    --white-team: #999;
    --bg: #f5f6f8;
    --card: #ffffff;
    --border: #e0e2e6;
    --text: #1a1c20;
    --muted: #6b7280;
  }
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    margin: 0;
    padding: 16px;
  }
  h1 { font-size: 1.3rem; margin: 0 0 4px; }
  .sub { color: var(--muted); font-size: 0.85rem; margin-bottom: 16px; }
  .tabs { display: flex; gap: 8px; margin-bottom: 16px; }
  .tab {
    flex: 1;
    padding: 10px 12px;
    text-align: center;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    cursor: pointer;
    font-weight: 600;
    font-size: 0.95rem;
  }
  .tab.active { background: var(--blue); color: white; border-color: var(--blue); }
  select {
    width: 100%;
    padding: 10px 12px;
    font-size: 1rem;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--card);
    color: var(--text);
    margin-bottom: 14px;
  }
  .panel { display: none; }
  .panel.active { display: block; }
  .game-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 12px 14px;
    margin-bottom: 10px;
  }
  .game-top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .game-date { font-weight: 700; font-size: 1.05rem; }
  .badge {
    font-size: 0.72rem;
    font-weight: 700;
    padding: 3px 8px;
    border-radius: 20px;
    color: white;
    white-space: nowrap;
  }
  .badge.SININEN { background: var(--blue); }
  .badge.VALKOINEN { background: #b8b8b8; color: #222; }
  .game-opp { color: var(--muted); font-size: 0.9rem; margin-top: 2px; }
  .game-type { font-size: 0.78rem; color: var(--muted); margin-top: 4px; }
  .roster-toggle {
    margin-top: 8px;
    font-size: 0.85rem;
    color: var(--blue);
    cursor: pointer;
    font-weight: 600;
    user-select: none;
  }
  .roster {
    display: none;
    margin-top: 8px;
    padding-top: 8px;
    border-top: 1px dashed var(--border);
    font-size: 0.88rem;
    line-height: 1.6;
  }
  .roster.show { display: block; }
  .roster-player {
    display: inline-block;
    background: #eef2f7;
    border-radius: 8px;
    padding: 3px 9px;
    margin: 2px 3px 2px 0;
  }
  .roster-player.goalie { background: #fde68a; }
  .player-meta {
    font-size: 0.82rem;
    color: var(--muted);
    margin-bottom: 14px;
  }
  .empty { color: var(--muted); font-size: 0.9rem; padding: 20px 0; text-align: center; }
  .section-label {
    font-weight: 700;
    font-size: 0.85rem;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.03em;
    margin: 18px 0 8px;
  }
  .section-label:first-child { margin-top: 0; }
</style>
</head>
<body>

<div class="sub">Lohko 2a (SININEN) ja Lohko 2b (VALKOINEN)</div>

const gameById = {};
DATA.games.forEach(g => gameById[g.id] = g);

function dateSort(a, b) {
  const parse = d => {
    const [day, month] = d.date.replace(/\.$/,'').split('.').map(Number);
    return month * 100 + day;
  };
  return parse(a) - parse(b);
}
DATA.games.sort(dateSort);

function goalieBadge(p) {
  return p.is_goalie ? ' &#127978;' : '';
}

function renderGameCard(g, opts) {
  opts = opts || {};
  const div = document.createElement('div');
  div.className = 'game-card';
  const rosterHtml = g.roster.map(name => {
    const pl = DATA.players.find(p => p.name === name);
    const cls = pl && pl.is_goalie ? 'roster-player goalie' : 'roster-player';
    return `<span class="${cls}">${escapeHtml(name)}${pl && pl.is_goalie ? ' 🥅' : ''}</span>`;
  }).join('');
  const highlightName = opts.highlightPlayer;
  const rosterId = 'roster-' + g.id + (opts.uid || '');
  div.innerHTML = `
    <div class="game-top">
      <div>
        <div class="game-date">${escapeHtml(g.date)}</div>
        <div class="game-opp">${escapeHtml(g.label.split('. ').slice(1).join('. ') || g.label)}</div>
      </div>
      <span class="badge ${g.color}">${g.color}</span>
    </div>
    <div class="game-type">${escapeHtml(g.type)} &middot; ${g.roster.length} pelaajaa</div>
    <div class="roster-toggle" data-target="${rosterId}">Näytä kokoonpano ▾</div>
    <div class="roster" id="${rosterId}">${rosterHtml}</div>
  `;
  return div;
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// ---- Player view ----
const playerSelect = document.getElementById('playerSelect');
DATA.players.forEach(p => {
  const opt = document.createElement('option');
  opt.value = p.name;
  opt.textContent = p.name + (p.is_goalie ? ' (maalivahti)' : '');
  playerSelect.appendChild(opt);
});

function renderPlayer() {
  const name = playerSelect.value;
  const p = DATA.players.find(x => x.name === name);
  const meta = document.getElementById('playerMeta');
  const gamesDiv = document.getElementById('playerGames');
  gamesDiv.innerHTML = '';
  if (!p) return;

  const games = p.game_ids.map(id => gameById[id]).filter(Boolean).sort(dateSort);
  meta.textContent = `${games.length} peliä yhteensä` + (p.is_goalie ? ` · maalivahtina ${p.goalie_games} pelissä (koko kausi)` : '');

  if (games.length === 0) {
    gamesDiv.innerHTML = '<div class="empty">Ei pelejä merkittynä.</div>';
    return;
  }
  games.forEach(g => gamesDiv.appendChild(renderGameCard(g, {uid: '-p'})));
}
playerSelect.addEventListener('change', renderPlayer);

// ---- Team view ----
const teamSelect = document.getElementById('teamSelect');
function renderTeam() {
  const color = teamSelect.value;
  const div = document.getElementById('teamGames');
  div.innerHTML = '';
  const games = DATA.games.filter(g => g.color === color).sort(dateSort);
  const pien = games.filter(g => g.type === 'Pienpelit');
  const iso = games.filter(g => g.type !== 'Pienpelit');

  if (pien.length) {
    const lbl = document.createElement('div');
    lbl.className = 'section-label';
    lbl.textContent = 'Pienpelit';
    div.appendChild(lbl);
    pien.forEach(g => div.appendChild(renderGameCard(g, {uid: '-t'})));
  }
  if (iso.length) {
    const lbl = document.createElement('div');
    lbl.className = 'section-label';
    lbl.textContent = 'Iso kenttä';
    div.appendChild(lbl);
    iso.forEach(g => div.appendChild(renderGameCard(g, {uid: '-t'})));
  }
}
teamSelect.addEventListener('change', renderTeam);

// ---- Tabs ----
document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
    tab.classList.add('active');
    document.getElementById('panel-' + tab.dataset.tab).classList.add('active');
  });
});

// ---- Roster toggle (delegated) ----
document.body.addEventListener('click', (e) => {
  const t = e.target.closest('.roster-toggle');
  if (!t) return;
  const target = document.getElementById(t.dataset.target);
  if (!target) return;
  target.classList.toggle('show');
  t.textContent = target.classList.contains('show') ? 'Piilota kokoonpano ▴' : 'Näytä kokoonpano ▾';
});

renderPlayer();
renderTeam();
</script>
</body>
</html>
